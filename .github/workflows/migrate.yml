name: Database Migration

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Liquibase
        run: |
          curl -sLO https://github.com/liquibase/liquibase/releases/download/v4.27.0/liquibase-4.27.0.tar.gz
          tar -xzf liquibase-4.27.0.tar.gz
          sudo mv liquibase-4.27.0 /opt/liquibase

          echo "/opt/liquibase" >> $GITHUB_PATH

      - name: Verify Liquibase Install
        run: liquibase --version

      - name: Run Liquibase Migration
        run: |
          liquibase \
            --changeLogFile=database/db.changelog-master.xml \
            --url="${{ secrets.DEV_DB_URL }}" \
            --username="${{ secrets.DEV_DB_USERNAME }}" \
            --password="${{ secrets.DEV_DB_PASSWORD }}" \
            update
